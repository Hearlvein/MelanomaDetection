name: tests

on:
  push:
  pull_request:

jobs:
  tabular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[tabular,dev]"
      - name: Test
        run: python -m pytest -q

  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[tabular,deep,dev]"
      - name: Test
        run: python -m pytest -q
