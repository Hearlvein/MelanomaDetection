[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melanoma-detection"
version = "0.1.0"
description = "Leak-free HAM10000 melanoma detection with tabular and deep models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
tabular = [
  "openpyxl>=3.1,<4",
  "matplotlib>=3.8,<4",
  "imbalanced-learn>=0.14,<1",
]
deep = [
  "tensorflow>=2.16,<3",
  "pillow>=10,<13",
]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: tests that require the raw HAM10000 inputs"]
